[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdriver"
version = "0.0.1"
description = "Scripts for hidden common cause reconstruction"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
    { name = "Zsigmond Benko", email = "benko.zsigmond@gmail.com" },
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "seaborn",
    "scikit-learn",
    "scipy",
    "torch",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
cdriver-run-family = "scripts.experiments.run_family:main"

[tool.setuptools.packages.find]
include = ["cdriver*", "scripts*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.uv.workspace]
members = [
    ".",
    "envs/maco_env",
    "envs/dca_env",
    "envs/dcca_env",
    "envs/shrec_env",
    "envs/sfa_env",
]
